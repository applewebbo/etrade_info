[dependency-groups]
dev = [
  "pytest",
  "pytest-django",
  "pytest-xdist",
  "pytest-cov",
  "pre-commit"
]

[project]
dependencies = [
  "nanodjango",
  "yfinance",
  "pandas",
  "openpyxl"
]
description = "Local equity tax simulator for Italian regime dichiarativo"
name = "etrade-info"
requires-python = ">=3.12"
version = "0.1.0"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
omit = ["migrations/*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning:django.core.handlers.base"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP"]
