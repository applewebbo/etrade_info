<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Etrade Portfolio{% endblock %}</title>
    <link rel="icon" href="/static/icons/stocks.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/blades.min.css" />
    <link rel="stylesheet" href="/static/pico.colors.min.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/alpine.min.js" defer></script>
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>{% csrf_token %}
    <header class="site-header">
      <nav class="container">
        <ul><li>
          <a href="/" class="site-brand">
            <img src="/static/icons/stocks.svg" class="site-icon" alt="" aria-hidden="true" />
            <span class="site-title">Etrade Portfolio</span>
          </a>
        </li></ul>
        <ul>
          <li><a href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>Dashboard</a></li>
          <li><a href="/simulate/" {% if request.path == "/simulate/" %}aria-current="page"{% endif %}>Vendita</a></li>
          <li><a href="/tasse/" {% if request.path == "/tasse/" %}aria-current="page"{% endif %}>Tasse</a></li>
          <li><a href="/import/" {% if request.path == "/import/" %}aria-current="page"{% endif %}>Impostazioni</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer class="site-footer container">
      <span class="site-footer-copyright">© {% now "Y" %} Etrade Portfolio</span>
      <nav class="site-footer-links">
        <a href="https://github.com/applewebbo/etrade_info" target="_blank" rel="noopener">
          <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          Codice sorgente
        </a>
        <a href="/novita/">
          <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l5.59-5.59a2 2 0 0 0 0-2.83Z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
          v{{ current_version }}
        </a>
      </nav>
    </footer>
  </body>
</html>
