{% extends "base.html" %}
{% block title %}Impostazioni — Etrade Portfolio{% endblock %}
{% block content %}

<h2>Impostazioni</h2>

<section>
  <article>
    <h3>Importa portfolio</h3>
    {% if count %}
    <p class="import-status">
      <span class="import-status-dot"></span>
      <strong>{{ count }} posizioni</strong> attualmente caricate
    </p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="import-grid">

        <div class="import-col">
          <p class="import-col-label">File</p>
          <label class="file-drop" x-data="{ name: '' }">
            <input type="file" name="xlsx" accept=".xlsx" required
                   x-on:change="name = $event.target.files[0]?.name ?? ''"
                   class="file-drop-input" />
            <span class="file-drop-icon">📂</span>
            <span class="file-drop-hint" x-text="name || 'ByStatus_expanded.xlsx'"></span>
            <span class="file-drop-sub">Clicca per selezionare il file</span>
          </label>
        </div>

        <div class="import-col">
          <p class="import-col-label">Modalità</p>
          <label class="mode-card" x-data>
            <input type="radio" name="mode" value="overwrite" checked class="mode-radio" />
            <span class="mode-card-body">
              <span class="mode-card-title">Sovrascrivi</span>
              <span class="mode-card-desc">Elimina tutte le posizioni esistenti e importa il file</span>
            </span>
          </label>
          <label class="mode-card">
            <input type="radio" name="mode" value="incremental" class="mode-radio" />
            <span class="mode-card-body">
              <span class="mode-card-title">Aggiungi</span>
              <span class="mode-card-desc">Aggiunge solo le posizioni non ancora presenti</span>
            </span>
          </label>
        </div>

      </div>
      <div class="form-actions">
        <button type="submit">Importa</button>
      </div>
    </form>
  </article>
</section>

{% endblock %}
