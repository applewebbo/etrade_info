<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Stock Tax IT{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  </head>
  <body>
    <header class="container">
      <nav>
        <ul><li><strong>Stock Tax IT</strong></li></ul>
        <ul>
          <li><a href="/" {% if request.path == "/" %}aria-current="page"{% endif %}>Dashboard</a></li>
          <li><a href="/simulate/" {% if request.path == "/simulate/" %}aria-current="page"{% endif %}>Simulatore</a></li>
          <li><a href="/import/" {% if request.path == "/import/" %}aria-current="page"{% endif %}>Importa</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
  </body>
</html>
