[dependency-groups]
dev = [
  "pytest",
  "pytest-django",
  "pytest-xdist",
  "pytest-cov",
  "pre-commit"
]

[project]
dependencies = [
  "nanodjango",
  "yfinance",
  "pandas",
  "openpyxl"
]
description = "Local equity tax simulator for Italian regime dichiarativo"
name = "etrade-info"
requires-python = ">=3.12"
version = "0.1.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
